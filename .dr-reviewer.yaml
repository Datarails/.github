# .dr-reviewer.yaml — dr-pr-reviewer per-repo config.
# Read from the repo's DEFAULT branch (a PR branch can't weaken its own gates).
# All keys optional. Bad values clamp to default (logged). An unparseable file
# fails CLOSED — repo not reviewed. Uncomment a line to customize.
#
# Org-level GitHub config and shared workflows. On-demand only: comment `@dr-pr-reviewer review` on a PR to run it.

# ── Master switches ─────────────────────────────────────────
enabled: true
auto_review: false           # on-demand only; poller won't auto-enqueue
# daily_diff_review: false   # scheduled review of default-branch merges

# ── Scope ───────────────────────────────────────────────────
path_filters:
  - "!**/*.lock"
dimensions: [correctness, security, infra, sweep]
# skip_authors: [dependabot[bot], renovate[bot], mend-for-github-com[bot]]
# only_authors: []           # non-empty = ONLY these authors' PRs reviewed (pilot gate)

# ── Findings ────────────────────────────────────────────────
severity_threshold: low
# max_findings: 25
fail_on: critical
# docstring_coverage: 80
instructions: |
  Organization-wide .github repo: reusable/shared GitHub Actions
  workflows consumed by every Datarails repo (currently a single
  risk-high-auto-resolve workflow). Review priorities:
  - Blast radius: any change here affects CI across the whole org, not
    just this repo, so validate workflow YAML syntax, triggers (on:),
    and permissions: blocks carefully.
  - Secrets/permissions: GITHUB_TOKEN scopes and any referenced org
    secrets should be minimal, never broadened without clear need.
  - Auto-resolve logic: confirm conditions that trigger auto-resolution
    are narrow and cannot misfire on unrelated PRs or repos.
  - Treat any unexpected non-workflow addition as scope creep.

# ── Comment garnish ─────────────────────────────────────────
summary: true
# poem: false

# ── Auto-approve (APPROVE not COMMENT when clean) ───────────
auto_approve:
  enabled: true
  paths: ["**"]
  max_risk: medium

# ── Advanced ────────────────────────────────────────────────
plugins: [dr-review-standards]
# mcp_servers: {}
# render_diff: {chart_repo, chart, version, values_glob}
